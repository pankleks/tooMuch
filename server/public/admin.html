<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ScreenTime – admin</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px;color:#111}
.card{border:1px solid #ddd;border-radius:10px;padding:12px 16px;margin:12px 0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;margin-top:8px}
th,td{border:1px solid #ddd;padding:6px 8px;font-size:14px;text-align:left}
.bar{height:10px;background:#eee;border-radius:6px;overflow:hidden;min-width:120px}
.bar>i{display:block;height:100%;background:#2a9d48}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:#eee}
.badge.lock{background:#f3c1c1}.badge.new{background:#ffe08a}
input[type=number]{width:80px}input[type=text]{width:180px}
button{padding:6px 12px;border-radius:8px;border:1px solid #999;background:#f6f6f6;cursor:pointer}
button.danger{background:#c62f2f;color:#fff;border-color:#a00}
.muted{color:#666;font-size:13px}
</style>
</head>
<body>
<h1>ScreenTime – panel rodzica</h1>
<p class="muted">Logowanie: BasicAuth <code>admin / ADMIN_PASSWORD</code>. Przeglądarka zapyta o hasło.</p>

<div class="card">
  <h3>Instalator Windows</h3>
  <div class="row">
    <button id="dl">Pobierz screentime-win-x64.zip</button>
    <span id="ver" class="muted"></span>
  </div>
  <p class="muted">Na PC dziecka: rozpakuj i jako admin <code>install.ps1 -ServerUrl http://raspberrypi.local:3020</code> (auto-register utworzy PC z defaultem 1440m).</p>
</div>

<div class="card">
  <div class="row">
    <button id="refresh">Odśwież</button>
    <span id="status" class="muted"></span>
  </div>
  <div id="list"></div>
</div>

<script src="/admin-static/admin.js"></script>
</body>
</html>
