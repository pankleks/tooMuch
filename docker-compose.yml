services:
  server:
    build: .
    image: toomuch-server:local
    ports:
      - "3020:3020"
    environment:
      PORT: "3020"
      TIME_ZONE: ${TIME_ZONE:-Europe/Warsaw}
      DATA_DIR: /data
      DIST_DIR: /data/dist
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ALLOW_AUTO_REGISTER: "true"
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
    volumes:
      - ./data:/data
      - ./certs:/certs:ro
    restart: unless-stopped
