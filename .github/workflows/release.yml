name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0 (leave empty when triggered by tag push)"
        required: false
        default: ""
jobs:
  windows-client:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
      - name: Resolve release tag
        id: rel
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "${{ github.ref_name }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "ver=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet publish ./client/TooMuch/TooMuch.csproj -c Release -o ./out
      - run: Copy-Item ./client/install.ps1,./client/uninstall.ps1 ./out/
        shell: pwsh
      - run: Compress-Archive -Path ./out/* -DestinationPath tooMuch-win-x64.zip
        shell: pwsh
      - run: |
          $sha = (Get-FileHash tooMuch-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          $ver = "${{ steps.rel.outputs.ver }}"
          "{`"version`": `"$ver`", `"sha256`": `"$sha`", `"url`": `"/api/admin/client-download`"}" | Out-File version.json -Encoding utf8
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: |
            tooMuch-win-x64.zip
            version.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: |
            tooMuch-win-x64.zip
            version.json

  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
      - name: Resolve release tag
        id: rel
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Lowercase image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}/toomuch-server" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.img.outputs.name }}:${{ steps.rel.outputs.tag }}
