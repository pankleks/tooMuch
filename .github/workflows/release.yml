name: release
on:
  push:
    tags: ["v*"]
jobs:
  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet publish ./client/ScreenTime/ScreenTime.csproj -c Release -o ./out
      - run: Copy-Item ./client/install.ps1,./client/uninstall.ps1 ./out/
        shell: pwsh
      - run: Compress-Archive -Path ./out/* -DestinationPath screentime-win-x64.zip
        shell: pwsh
      - run: |
          $sha = (Get-FileHash screentime-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          $ver = "${{ github.ref_name }}".TrimStart("v")
          "{`"version`": `"$ver`", `"sha256`": `"$sha`", `"url`": `"/api/admin/client-download`"}" | Out-File version.json -Encoding utf8
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: |
            screentime-win-x64.zip
            version.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            screentime-win-x64.zip
            version.json

  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/screentime-server:${{ github.ref_name }}
