name: client-ci
on:
  # no paths filter: client tests must run on every push,
  # otherwise server-only commits silently skip them
  push:
  pull_request:
jobs:
  build-test:
    # Windows-only: TooMuch.csproj targets net8.0-windows + WinForms
    # (Registry, NotifyIcon, LockWorkStation) so it can neither build
    # reliably nor execute tests on ubuntu. Pure logic is covered by
    # TooMuch.Tests running on this same windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build ./client/TooMuch/TooMuch.csproj
      - run: dotnet test ./client/TooMuch.Tests/TooMuch.Tests.csproj
