name: server-ci
on:
  # no paths filter: run on every push so nothing is silently skipped
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npx vitest run
        working-directory: server
        env:
          ADMIN_PASSWORD: test-admin
